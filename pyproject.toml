[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidney-stone-classifier"
version = "1.0.0"
description = "Transfer-learning classification and YOLOv8 detection pipelines for kidney stone medical imaging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirhossein Jafarnezhad" }]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "efficientnet-pytorch>=0.7",
    "torcheval>=0.0.7",
    "ultralytics>=8.1",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
kaggle = ["kagglehub>=0.2"]

[project.scripts]
kidney-stone-cli = "kidney_stone_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
